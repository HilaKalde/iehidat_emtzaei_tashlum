<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>חדר כושר פיננסי – אמצעי תשלום</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/payments.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <div id="screens"></div>
      <div id="chrome"></div>
    </div>
  </div>

  <!-- כלי בדיקה (מחוץ לבמה – לא חלק מהלומדה) -->
  <div id="review">
    <select id="review-jump" title="מעבר למסך"></select>
    <button id="review-notes" title="הערות הפקה ותסריטי סרטונים (מקש N)">📝 הערות</button>
    <button id="review-reset" title="איפוס התקדמות">↺ איפוס</button>
  </div>
  <div id="notes"></div>
  <div id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
